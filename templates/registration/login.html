{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log in · PIMIS Fraud Watch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'dashboard/css/style.css' %}" rel="stylesheet">
</head>
<body style="background:var(--pimis-navy); min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="card-panel" style="width:360px;">
        <h5 class="mb-1">Fraud Watch</h5>
        <p class="text-muted small mb-3">Sign in to view the monitoring dashboard.</p>
        {% if form.errors %}
            <div class="alert alert-danger py-2 small">Invalid username or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-2">
                <label class="form-label small">Username</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Log in</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</body>
</html>
